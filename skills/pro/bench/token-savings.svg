<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0d1117"/>

  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" fill="white" font-size="18" font-family="monospace">
    Token Savings by Scenario
  </text>

  <!-- Axes -->
  <line x1="60" y1="340" x2="560" y2="340" stroke="#555" stroke-width="2"/>
  <line x1="60" y1="340" x2="60" y2="60" stroke="#555" stroke-width="2"/>

  <!-- Labels -->
  <text x="300" y="365" text-anchor="middle" fill="white" font-size="12" font-family="monospace">
    Scenarios
  </text>
  <text x="20" y="200" text-anchor="middle" fill="white" font-size="12" fill="#555" font-family="monospace"
        transform="rotate(-90 20,200)">
    % Reduction
  </text>

  <!-- Bars -->
  <!-- Debugging Session -->
  <rect x="120" y="77" width="80" height="263" fill="#58a6ff"/>
  <text x="160" y="67" text-anchor="middle" fill="white" font-size="12" font-family="monospace">94%</text>
  <text x="160" y="365" text-anchor="middle" fill="white" font-size="12" font-family="monospace">
    Debugging
  </text>

  <!-- Code Review -->
  <rect x="320" y="264" width="80" height="76" fill="#7ee787"/>
  <text x="360" y="254" text-anchor="middle" fill="white" font-size="12" font-family="monospace">27%</text>
  <text x="360" y="365" text-anchor="middle" fill="white" font-size="12" font-family="monospace">
    Code Review
  </text>

  <!-- Average -->
  <rect x="480" y="204" width="80" height="136" fill="#ffa657"/>
  <text x="520" y="210" text-anchor="middle" fill="white" font-size="12" font-family="monospace">42%</text>
  <text x="520" y="365" text-anchor="middle" fill="white" font-size="12" font-family="monospace">
    Average
  </text>

  <!-- Y-axis values -->
  <text x="55" y="340" text-anchor="end" fill="white" font-size="10" font-family="monospace">0%</text>
  <text x="55" y="290" text-anchor="end" fill="white" font-size="10" font-family="monospace">20%</text>
  <text x="55" y="240" text-anchor="end" fill="white" font-size="10" font-family="monospace">40%</text>
  <text x="55" y="190" text-anchor="end" fill="white" font-size="10" font-family="monospace">60%</text>
  <text x="55" y="140" text-anchor="end" fill="white" font-size="10" font-family="monospace">80%</text>
  <text x="55" y="90" text-anchor="end" fill="white" font-size="10" font-family="monospace">100%</text>

  <!-- Grid lines -->
  <line x1="60" y1="290" x2="560" y2="290" stroke="#21262d" stroke-width="1" stroke-dasharray="4"/>
  <line x1="60" y1="240" x2="560" y2="240" stroke="#21262d" stroke-width="1" stroke-dasharray="4"/>
  <line x1="60" y1="190" x2="560" y2="190" stroke="#21262d" stroke-width="1" stroke-dasharray="4"/>
  <line x1="60" y1="140" x2="560" y2="140" stroke="#21262d" stroke-width="1" stroke-dasharray="4"/>

  <!-- Legend -->
  <rect x="400" y="280" width="140" height="50" fill="#161b22" stroke="#30363d" rx="4"/>
  <rect x="410" y="295" width="12" height="12" fill="#58a6ff"/>
  <text x="430" y="305" fill="white" font-size="12" font-family="monospace">Debugging</text>
  <rect x="410" y="315" width="12" height="12" fill="#7ee787"/>
  <text x="430" y="325" fill="white" font-size="12" font-family="monospace">Code Review</text>
  <rect x="410" y="335" width="12" height="12" fill="#ffa657"/>
  <text x="430" y="345" fill="white" font-size="12" font-family="monospace">Average</text>
</svg>